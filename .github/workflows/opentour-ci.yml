name: OpenTour CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Standard library regression suite
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.16-slim-bookworm@sha256:0f086103b026048cc50cb5da25ec435c023c5241a83fc44daea593377abc61c4
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record runtime
        shell: sh
        run: |
          {
            echo '## OpenTour Python regression suite'
            echo
            echo '- Runtime: Python 3.12.16 in the pinned official Python container.'
            echo '- Test command: `python3 -m unittest discover -s tests -p "test_*.py" -v`'
            echo '- Scope: repository tests with synthetic fixtures; no CRM credentials or owner artifacts are provided.'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 --version

      - name: Run shared test command
        id: unit-tests
        shell: sh
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_*.py" -v > "$RUNNER_TEMP/opentour-unittest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opentour-unittest.log"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record test result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
          TEST_EXIT_CODE: ${{ steps.unit-tests.outputs.exit_code }}
        shell: sh
        run: |
          {
            echo
            echo '### Test result'
            echo "- Outcome: ${TEST_OUTCOME:-not started}"
            echo "- Exit code: ${TEST_EXIT_CODE:-not recorded}"
            echo '- Detailed, verbose output is in the test step log; no output artifact is uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
