name: OpenTour CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Product branch or pull request ref being tested
        required: true
        type: string
      candidate_sha:
        description: Exact full commit SHA that must be checked out
        required: true
        type: string

permissions:
  contents: read

jobs:
  python-tests:
    name: Standard library regression suite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - name: Verify candidate revision
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref || github.ref }}
          EXPECTED_SHA: ${{ inputs.candidate_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: sh
        run: |
          actual_sha=$(git rev-parse HEAD)
          {
            echo '## Candidate source identity'
            echo
            echo "- Event: ${EVENT_NAME}"
            echo "- Candidate ref: ${CANDIDATE_REF}"
            echo "- Expected SHA: ${EXPECTED_SHA}"
            echo "- Checked-out SHA: ${actual_sha}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Checked-out SHA ${actual_sha} does not match expected SHA ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Record runtime
        shell: sh
        run: |
          {
            echo '## OpenTour Python regression suite'
            echo
            echo '- Test runtime: official Python 3.12.16 container pinned by digest; source checkout and git HEAD verification run on the fixed Ubuntu runner.'
            echo '- Test command: `python3 -m unittest discover -s tests -p "test_*.py" -v`'
            echo '- Scope: repository tests with synthetic fixtures; no CRM credentials or owner artifacts are provided.'
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --pull=always --network=none python:3.12.16-slim-bookworm@sha256:0f086103b026048cc50cb5da25ec435c023c5241a83fc44daea593377abc61c4 python3 --version

      - name: Run shared test command
        id: unit-tests
        shell: sh
        run: |
          set +e
          docker run --rm --pull=always --network=none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --env PYTHONDONTWRITEBYTECODE=1 --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace python:3.12.16-slim-bookworm@sha256:0f086103b026048cc50cb5da25ec435c023c5241a83fc44daea593377abc61c4 python3 -m unittest discover -s tests -p "test_*.py" -v > "$RUNNER_TEMP/opentour-unittest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opentour-unittest.log"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record test result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
          TEST_EXIT_CODE: ${{ steps.unit-tests.outputs.exit_code }}
        shell: sh
        run: |
          {
            echo
            echo '### Test result'
            echo "- Outcome: ${TEST_OUTCOME:-not started}"
            echo "- Exit code: ${TEST_EXIT_CODE:-not recorded}"
            echo '- Detailed, verbose output is in the test step log; no output artifact is uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
